<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>勞工退休金個人自願提繳申請/異動表</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 50px; line-height: 1.6; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; }
        input[type="text"], input[type="email"] { width: 300px; padding: 8px; }
        button { padding: 10px 15px; background-color: #007bff; color: white; border: none; cursor: pointer; }
        button:hover { background-color: #0056b3; }
    </style>
</head>
<body>

    <h2>📝 勞工退休金個人自願提繳申請/異動表</h2>
    
    <form action="https://formspree.io/f/xxxxxxxx" method="POST">
        
        <div class="form-group">
            <label for="name">申請人姓名：</label>
            <input type="text" id="name" name="name" required placeholder="請輸入姓名">
        </div>

        <div class="form-group">
            <label for="employee_id">申請人 員工編號：</label>
            <input type="text" id="employee_id" name="employee_id" required placeholder="請輸入員工編號">
        </div>

        <div class="form-group">
            <label for="email">申請人 Email：</label>
            <input type="email" id="email" name="email" required placeholder="請輸入 Email">
        </div>

        <button type="submit">送出申請</button>
    </form>

</body>
</html>
